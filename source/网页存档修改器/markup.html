<div class="workspace hidden" id="areaWorkspace">
  <aside class="roster">
    <div class="roster-head">
      <div class="roster-title"><span class="ornament">❖</span>区域名册</div>
      <div class="roster-count" id="areaCount">—</div>
    </div>
    <div class="roster-search">
      <input type="text" id="areaSearch" placeholder="搜索区域名 / 门派">
    </div>
    <div class="roster-filters" id="areaFilters">
      <button class="filter-chip active" data-afilter="all">全部</button>
      <button class="filter-chip" data-afilter="0">城市</button>
      <button class="filter-chip" data-afilter="2">门派</button>
      <button class="filter-chip" data-afilter="1">村镇</button>
    </div>
    <div class="roster-list" id="areaList"></div>
  </aside>
  <main class="detail" id="areaDetail">
    <div class="detail-empty">从左侧选择一个区域</div>
  </main>
</div>
