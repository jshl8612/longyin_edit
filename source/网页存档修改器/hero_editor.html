const dropzone = document.getElementById('dropzone');
['dragenter','dragover'].forEach(ev => {
  document.addEventListener(ev, e => {
    e.preventDefault();
    if (state.rawData) return;
    dropzone.classList.add('dragging');
  });
});
['dragleave','drop'].forEach(ev => {
  document.addEventListener(ev, e => {
    e.preventDefault();
    if (ev === 'dragleave' && e.relatedTarget) return;
    dropzone.classList.remove('dragging');
  });
});
document.addEventListener('drop', async e => {
  e.preventDefault();
  if (state.rawData) return;
  const item = e.dataTransfer.items?.[0];
  // 尝试拿 FileSystem handle（Chrome/Edge），有 handle 就能直接覆盖原文件
  if (item && item.getAsFileSystemHandle) {
    try {
      const handle = await item.getAsFileSystemHandle();
      if (handle && handle.kind === 'file') {
        state.fileHandle = handle;
        const f = await handle.getFile();
        loadFile(f);
        return;
      }
    } catch (err) { /* fallback */ }
  }
  const f = e.dataTransfer.files[0];
  if (f) loadFile(f);
});
document.getElementById('btnPick').addEventListener('click', async () => {
  // 优先用 showOpenFilePicker 拿到 handle
  if (window.showOpenFilePicker) {
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: '龙胤立志传 Hero 存档', accept: { '*/*': [''] } }],
        excludeAcceptAllOption: false,
      });
      state.fileHandle = handle;
      const f = await handle.getFile();
      loadFile(f);
      return;
    } catch (err) {
      if (err.name === 'AbortError') return;
      // fallback 到普通 input
    }
  }
  document.getElementById('filePick').click();
});
document.getElementById('filePick').addEventListener('change', e => {
  const f = e.target.files[0];
  state.fileHandle = null;
  if (f) loadFile(f);
});
document.getElementById('btnSave').addEventListener('click', saveFile);
document.getElementById('btnReload').addEventListener('click', async () => {
  // 有 file handle：直接重新读取原文件，丢弃所有未保存修改
  if (state.fileHandle) {
    if (state.dirtyIdx.size > 0 && !confirm('将丢弃所有未保存的修改，从磁盘重新读取原文件？')) return;
    try {
      if (state.fileHandle.queryPermission) {
        const perm = await state.fileHandle.queryPermission({ mode: 'read' });
        if (perm !== 'granted') {
          const req = await state.fileHandle.requestPermission({ mode: 'read' });
          if (req !== 'granted') throw new Error('未授予读取权限');
        }
      }
      const handle = state.fileHandle;
      const f = await handle.getFile();
      await loadFile(f);
      state.fileHandle = handle; // loadFile 不动 handle，确保保留
      showToast(`已重新载入: ${f.name}`);
      return;
    } catch (e) {
      showToast('重新读取失败：' + e.message, true);
      // 失败则继续走下面的回到拖放界面
    }
  }
  // 无 handle（旧浏览器或 input 选的文件，无法静默重读）：回到拖放界面
  if (state.dirtyIdx.size > 0 && !confirm('有未保存的修改，确定返回？')) return;
  state.rawData = null;
  state.selectedIdx = -1;
  state.dirtyIdx.clear();
  state.fileHandle = null;
  document.getElementById('workspace').classList.add('hidden');
  document.getElementById('dropzone').classList.remove('hidden');
  document.getElementById('btnReload').disabled = true;
  document.getElementById('btnSave').disabled = true;
  document.getElementById('fileInfo').textContent = '';
  document.getElementById('filePick').value = '';
});
document.getElementById('searchInput').addEventListener('input', renderRoster);
document.getElementById('forceFilter').addEventListener('change', e => {
  state.rosterForce = e.target.value;
  renderRoster();
});
document.getElementById('sexFilter').addEventListener('change', e => {
  state.rosterSex = e.target.value;
  renderRoster();
});
document.getElementById('talentFilter').addEventListener('change', e => {
  state.rosterTalent = e.target.value;
  renderRoster();
});
document.getElementById('rosterFilters').addEventListener('click', e => {
  const chip = e.target.closest('.filter-chip');
  if (!chip) return;
  // 独立开关：隐藏地点不明
  if (chip.id === 'chipHideNoArea') {
    state.rosterHideNoArea = !state.rosterHideNoArea;
    chip.classList.toggle('active', state.rosterHideNoArea);
    renderRoster();
    return;
  }
  // 单选组（all/alive/player/dirty）
  if (!chip.dataset.filter) return;
  state.rosterFilter = chip.dataset.filter;
  document.querySelectorAll('.filter-chip[data-filter]').forEach(c => c.classList.toggle('active', c === chip));
  renderRoster();
});
</script>
</body>
</html>
